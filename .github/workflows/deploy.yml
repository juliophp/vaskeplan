name: Deploy TanStack/Nitro to Azure

on:
  push:
    branches:
      - main # Change to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Match your local Node version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Create Zip Package for Azure
        # This zips ONLY the required production runtime files
        run: zip -r deploy.zip .output package.json

      - name: Deploy to Azure App Service via Zip Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lovabledemo' # Change to your App Service name
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: 'deploy.zip'
